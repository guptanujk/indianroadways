<!DOCTYPE html>
<html lang="hi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>डीलक्स रोडवेज</title>


    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='24' rx='4' fill='%232563EB'/%3E%3Crect x='5' y='5' width='22' height='9' rx='2' fill='%2393C5FD'/%3E%3Cline x1='2' y1='17' x2='30' y2='17' stroke='%231E40AF' stroke-width='1.5'/%3E%3Ccircle cx='6.5' cy='21' r='1.75' fill='%23FDE047'/%3E%3Ccircle cx='25.5' cy='21' r='1.75' fill='%23FDE047'/%3E%3Crect x='12' y='20' width='8' height='2' rx='1' fill='%231E40AF'/%3E%3Crect x='5' y='26' width='5' height='4' rx='1' fill='%231E293B'/%3E%3Crect x='22' y='26' width='5' height='4' rx='1' fill='%231E293B'/%3E%3C/svg%3E">
    
    <!-- <link
        rel="icon"
        type="image/svg"
        href="assets/gmi.svg"
    > -->


    <!-- Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Amita:wght@400;700&family=Cormorant:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<main class="scene">


    <!-- =================================
         BACKGROUND
    ================================== -->

    <div class="overlay"></div>



    <!-- =================================
         TOP BAR
    ================================== -->

    <header class="topbar">


        <div
            class="time"
            id="time"
        >
            6:00 pm
        </div>



        <div class="online">

            <span class="online-dot"></span>

            <span id="listeners">
                34
            </span>

            <span>online</span>

        </div>



        <nav class="links">

            <a
                href="https://open.spotify.com/playlist/0rmIgHUJdj45xxIl9zPd2I?si=c-xi91qWSqihw2BrFMP9Qw"
                target="_blank"
                rel="noopener noreferrer"
            >
                Spotify
                <span>↗</span>
            </a>


            <!-- <a
                href="https://music.youtube.com/"
                target="_blank"
                rel="noopener noreferrer"
            >
                YT Music
                <span>↗</span>
            </a> -->

        </nav>


    </header>



    <!-- =================================
         TITLE
    ================================== -->

    <section class="hero">

        <h1 class="roadways-title">

            <span class="deluxe">
                डीलक्स
            </span>

            <span class="roadways">
                रोडवेज
            </span>

        </h1>

    </section>



    <!-- =================================
         CUSTOM MUSIC PLAYER
    ================================== -->

    <section class="player">


        <!-- Album art -->

        <div class="album-art">

            <img
                id="albumArt"
                src="assets\songs\Hindi\song-image\gmo.svg"
                alt="Current song"
            >

        </div>
        



        <!-- Song information -->

        <div class="track-info">


            <div class="now-playing">
                NOW PLAYING
            </div>


            <div
                class="song-name"
                id="songName"
            >
                Mujhse Mohabbat Ka Izhaar Karta
            </div>


            <div
                class="artist"
                id="artist"
            >
                Kumar Sanu, Alka Yagnik
            </div>



            <!-- Progress -->

            <div class="progress-container">


                <div
                    class="progress-bar"
                    id="progressBar"
                >

                    <div
                        class="progress"
                        id="progress"
                    ></div>

                </div>



                <div class="time-labels">

                    <span id="currentTime">
                        0:00
                    </span>

                    <span id="duration">
                        0:00
                    </span>

                </div>


            </div>


        </div>



        <!-- Controls -->

        <div class="controls">


            <button
                id="previousBtn"
                class="side-button"
                aria-label="Previous song"
            >
                |◀
            </button>



            <button
                id="playBtn"
                class="play-button"
                aria-label="Play"
            >
                ▶
            </button>



            <button
                id="nextBtn"
                class="side-button"
                aria-label="Next song"
            >
                ▶|
            </button>


        </div>


    </section>



    <!-- =================================
         AUDIO
    ================================== -->

    <audio
        id="audio"
        preload="metadata"
    ></audio>


</main>


<script src="script.js"></script>

</body>

</html>
