<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Indian Roadways — The Sound of the Journey</title>
    <link
    rel="icon"
    type="image/png"
    href="assets/favicon.png"
    >


    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

</head>


<body>

<main class="scene">

    <!-- Dark overlay -->
    <div class="overlay"></div>


    <!-- =========================
         TOP BAR
    ========================== -->

    <header class="topbar">

        <div
            class="time"
            id="time"
        >
            6:00 pm
        </div>


        <div class="online">

            <span class="online-dot"></span>

            <span id="listeners">
                34
            </span>

            online

        </div>


        <div class="links">

            <a
                href="https://open.spotify.com/"
                target="_blank"
                rel="noopener noreferrer"
            >
                Spotify ↗
            </a>


            <a
                href="https://music.youtube.com/"
                target="_blank"
                rel="noopener noreferrer"
            >
                YT Music ↗
            </a>

        </div>

    </header>



    <!-- =========================
         HERO
    ========================== -->

    <section class="hero">

        <div class="title-hindi">
            रोडवेज
        </div>


        <div class="title-english">
            INDIAN ROADWAYS
        </div>


        <p class="tagline">
            The sound of the journey.
        </p>

    </section>



    <!-- =========================
         CUSTOM PLAYER
    ========================== -->

    <section class="player">


        <!-- Album artwork -->

        <div class="album-art">

            <img
                id="albumArt"
                src="assets/background.png"
                alt="Indian Roadways"
            >

        </div>



        <!-- Track information -->

        <div class="track-info">

            <div
                class="song-name"
                id="songName"
            >
                Mujhse Mohabbat Ka Izhaar Karta
            </div>


            <div
                class="artist"
                id="artist"
            >
                Kumar Sanu, Alka Yagnik
            </div>


            <!-- Progress -->

            <div class="progress-container">

                <div
                    class="progress-bar"
                    id="progressBar"
                >

                    <div
                        class="progress"
                        id="progress"
                    ></div>

                </div>


                <div class="time-labels">

                    <span id="currentTime">
                        0:00
                    </span>

                    <span id="duration">
                        0:00
                    </span>

                </div>

            </div>

        </div>



        <!-- Controls -->

        <div class="controls">

            <button
                id="previousBtn"
                class="side-button"
                aria-label="Previous song"
            >
                |◀
            </button>


            <button
                id="playBtn"
                class="play-button"
                aria-label="Play"
            >
                ▶
            </button>


            <button
                id="nextBtn"
                class="side-button"
                aria-label="Next song"
            >
                ▶|
            </button>

        </div>


    </section>



    <!-- =========================
         AUDIO
    ========================== -->

    <audio
        id="audio"
        preload="metadata"
    ></audio>


</main>


<script src="script.js"></script>

</body>

</html>
