<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>डीलक्स रोडवेज</title>

    <link
        rel="icon"
        type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='24' rx='4' fill='%232563EB'/%3E%3Crect x='5' y='5' width='22' height='9' rx='2' fill='%2393C5FD'/%3E%3Cline x1='2' y1='17' x2='30' y2='17' stroke='%231E40AF' stroke-width='1.5'/%3E%3Ccircle cx='6.5' cy='21' r='1.75' fill='%23FDE047'/%3E%3Ccircle cx='25.5' cy='21' r='1.75' fill='%23FDE047'/%3E%3Crect x='12' y='20' width='8' height='2' rx='1' fill='%231E40AF'/%3E%3Crect x='5' y='26' width='5' height='4' rx='1' fill='%231E293B'/%3E%3Crect x='22' y='26' width='5' height='4' rx='1' fill='%231E293B'/%3E%3C/svg%3E"
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Amita:wght@400;700&family=Cormorant:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
/* =========================================
   DELUXE ROADWAYS
   VISUAL THEME
========================================= */

:root {

    --cream: #f5ead4;
    --cream-soft: #e9dcc4;

    --dark: #17201c;
    --dark-soft: rgba(20, 28, 25, 0.86);

    --gold: #d1ad70;
    --green: #78927b;

    --white-soft: rgba(255, 255, 255, 0.72);

}


/* =========================================
   RESET
========================================= */

* {

    margin: 0;
    padding: 0;

    box-sizing: border-box;

}


html,
body {

    width: 100%;
    height: 100%;

}


html {

    background: #101613;

}


body {

    font-family:
        "Space Grotesk",
        sans-serif;

    background: #101613;

    color: var(--cream);

    overflow: hidden;

}


/* =========================================
   SCENE
========================================= */

.scene {

    position: relative;

    width: 100vw;
    width: 100dvw;

    height: 100vh;
    height: 100dvh;

    min-height: 100svh;

    background-image:
        url("assets/b12.png");

    background-size: cover;

    background-position: center;

    background-repeat: no-repeat;

}


/* =========================================
   CINEMATIC OVERLAY
========================================= */

.overlay {

    position: absolute;

    inset: 0;

    background:

        linear-gradient(
            180deg,
            rgba(12, 18, 16, 0.30) 0%,
            rgba(12, 18, 16, 0.03) 40%,
            rgba(12, 18, 16, 0.08) 60%,
            rgba(12, 18, 16, 0.62) 100%
        );

    pointer-events: none;

}


/* =========================================
   TOP BAR
========================================= */

.topbar {

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;

    padding: 25px 30px;

    display: flex;

    align-items: center;

    z-index: 20;

}


/* =========================================
   CLOCK
========================================= */

.time {

    font-size: 14px;

    font-weight: 500;

    color: var(--cream);

    opacity: 0.9;

}


/* =========================================
   ONLINE
========================================= */

.online {

    position: absolute;

    left: 50%;

    transform: translateX(-50%);

    display: flex;

    align-items: center;

    gap: 7px;

    padding: 6px 11px;

    border-radius: 20px;

    background:
        rgba(18, 27, 23, 0.55);

    border:
        1px solid
        rgba(245, 234, 212, 0.12);

    backdrop-filter: blur(8px);

    -webkit-backdrop-filter: blur(8px);

    font-size: 12px;

    font-weight: 500;

    color: #fff3d8;

    opacity: 0.95;

}


.online-dot {

    width: 7px;
    height: 7px;

    flex-shrink: 0;

    border-radius: 50%;

    background: #78c77f;

    box-shadow:
        0 0 8px
        rgba(120, 199, 127, 0.7);

}


/* =========================================
   TOP LINKS
========================================= */

.links {

    margin-left: auto;

    display: flex;

    gap: 24px;

}


.links a {

    color: var(--cream);

    text-decoration: none;

    font-size: 13px;

    font-weight: 500;

    opacity: 0.82;

    transition:
        color 0.2s ease,
        opacity 0.2s ease;

}


.links a:hover {

    color: var(--gold);

    opacity: 1;

}


.links a span {

    margin-left: 3px;

    opacity: 0.6;

}


/* =========================================
   TITLE
========================================= */

.hero {

    position: absolute;

    top: 15%;

    left: 50%;

    transform:
        translateX(-50%);

    width: 90%;

    text-align: center;

    z-index: 10;

    pointer-events: none;

}


/* =========================================
   TITLE GLOW
========================================= */

.hero::before {

    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 600px;
    height: 350px;

    transform:
        translate(-50%, -50%);

    background:

        radial-gradient(
            ellipse,
            rgba(20, 18, 14, 0.22) 0%,
            rgba(20, 18, 14, 0.08) 45%,
            transparent 72%
        );

    z-index: -1;

    pointer-events: none;

}


/* =========================================
   ROADWAYS TITLE
========================================= */

.roadways-title {

    margin: 0;
    padding: 0;

    display: flex;

    flex-direction: column;

    align-items: center;

    font-family:
        "Amita",
        serif;

    font-weight: 700;

    line-height: 1;

    letter-spacing: 0;

    color: var(--cream);

    text-shadow:

        0 4px 10px
        rgba(0, 0, 0, 0.28),

        0 10px 30px
        rgba(0, 0, 0, 0.22);

}


.roadways-title .deluxe {

    font-size:
        clamp(75px, 9vw, 145px);

    transform:
        translateX(-8px);

    margin-bottom: 10px;

}


.roadways-title .roadways {

    font-size:
        clamp(75px, 9vw, 145px);

}


/* =========================================
   PLAYER
========================================= */

.player {

    position: fixed;

    left: 50%;

    bottom:
        calc(28px + env(safe-area-inset-bottom));

    transform:
        translateX(-50%);

    width:
        min(
            780px,
            calc(100vw - 40px)
        );

    min-height: 94px;

    padding: 10px 18px;

    display: flex;

    align-items: center;

    gap: 17px;

    z-index: 9999;

    border-radius: 52px;

    background:
        rgba(20, 27, 24, 0.48);

    backdrop-filter:
        blur(12px);

    -webkit-backdrop-filter:
        blur(12px);

    border:
        1px solid
        rgba(245, 234, 212, 0.18);

    box-shadow:
        0 18px 50px
        rgba(0, 0, 0, 0.38);

}


/* =========================================
   ALBUM ART
========================================= */

.album-art {

    width: 68px;
    height: 68px;

    flex-shrink: 0;

    overflow: hidden;

    border-radius: 50%;

    border:
        1px solid
        rgba(245, 234, 212, 0.16);

    box-shadow:
        0 6px 18px
        rgba(0, 0, 0, 0.35);

}


.album-art img {

    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;

}


/* =========================================
   HIDDEN YOUTUBE PLAYER
========================================= */

#youtube-player {

    position: fixed;

    width: 1px;
    height: 1px;

    left: -9999px;
    top: -9999px;

    opacity: 0;

    pointer-events: none;

}


/* =========================================
   TRACK INFO
========================================= */

.track-info {

    flex: 1;

    min-width: 0;

}


/* =========================================
   NOW PLAYING
========================================= */

.now-playing {

    margin-bottom: 3px;

    font-size: 8px;

    font-weight: 600;

    letter-spacing: 1.5px;

    color: var(--gold);

    opacity: 0.9;

}


/* =========================================
   SONG
========================================= */

.song-name {

    font-size: 15px;

    font-weight: 600;

    color: var(--cream);

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

}


/* =========================================
   ARTIST
========================================= */

.artist {

    margin-top: 3px;

    font-size: 11px;

    color: var(--white-soft);

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

}


/* =========================================
   PROGRESS
========================================= */

.progress-container {

    margin-top: 9px;

}


.progress-bar {

    width: 100%;

    height: 3px;

    background:
        rgba(245, 234, 212, 0.18);

    border-radius: 10px;

    cursor: pointer;

    overflow: hidden;

}


.progress-bar:focus-visible {

    outline:
        1px solid
        var(--gold);

    outline-offset: 4px;

}


.progress {

    width: 0%;

    height: 100%;

    background:
        var(--gold);

    border-radius: 10px;

}


/* =========================================
   TIME LABELS
========================================= */

.time-labels {

    display: flex;

    justify-content: space-between;

    margin-top: 4px;

    font-size: 8px;

    color:
        rgba(245, 234, 212, 0.42);

}


/* =========================================
   CONTROLS
========================================= */

.controls {

    display: flex;

    align-items: center;

    gap: 13px;

    flex-shrink: 0;

}


.controls button {

    border: none;

    background: transparent;

    color: var(--cream);

    cursor: pointer;

    font-family:
        "Space Grotesk",
        sans-serif;

    -webkit-tap-highlight-color:
        transparent;

}


/* =========================================
   PREVIOUS / NEXT
========================================= */

.side-button {

    width: 26px;
    height: 35px;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 12px;

    opacity: 0.55;

    transition:
        color 0.2s ease,
        opacity 0.2s ease,
        transform 0.2s ease;

}


.side-button:hover {

    color: var(--gold);

    opacity: 1;

    transform:
        scale(1.08);

}


.side-button:focus-visible {

    outline:
        1px solid
        var(--gold);

    outline-offset: 3px;

}


/* =========================================
   PLAY
========================================= */

.play-button {

    width: 50px;
    height: 50px;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-shrink: 0;

    border-radius: 50%;

    background:
        var(--cream) !important;

    color:
        #18201c !important;

    font-size: 16px;

    font-weight: 600;

    box-shadow:
        0 5px 20px
        rgba(0, 0, 0, 0.25);

    transition:
        background 0.18s ease,
        transform 0.18s ease;

}


.play-button:hover {

    background:
        var(--gold) !important;

    transform:
        scale(1.06);

}


.play-button:active {

    transform:
        scale(0.94);

}


.play-button:focus-visible {

    outline:
        2px solid
        var(--gold);

    outline-offset: 4px;

}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 700px) {

    .topbar {

        padding:
            18px 20px;

    }


    .online {

        display: none;

    }


    .links {

        gap: 14px;

    }


    .links a {

        font-size: 11px;

    }


    /* TITLE */

    .hero {

        top: 11%;

    }


    .roadways-title .deluxe {

        font-size: 68px;

    }


    .roadways-title .roadways {

        font-size: 68px;

    }


    /* =================================
       MOBILE PLAYER
    ================================== */

    .player {

        position: fixed;

        left: 50%;

        bottom:
            calc(
                10px +
                env(safe-area-inset-bottom)
            );

        transform:
            translateX(-50%);

        width:
            calc(100vw - 20px);

        min-height: 82px;

        padding:
            8px 11px;

        gap: 11px;

        z-index: 99999;

        border-radius: 44px;

        background:
            rgba(20, 27, 24, 0.82);

        backdrop-filter:
            blur(14px);

        -webkit-backdrop-filter:
            blur(14px);

        border:
            1px solid
            rgba(245, 234, 212, 0.18);

        box-shadow:
            0 12px 40px
            rgba(0, 0, 0, 0.55);

    }


    .album-art {

        width: 54px;
        height: 54px;

    }


    .track-info {

        flex: 1;

        min-width: 0;

    }


    .now-playing {

        font-size: 7px;

    }


    .song-name {

        font-size: 13px;

    }


    .artist {

        font-size: 10px;

    }


    .progress-container {

        margin-top: 7px;

    }


    .controls {

        gap: 5px;

        flex-shrink: 0;

    }


    .side-button {

        display: flex;

        width: 21px;
        height: 35px;

        font-size: 10px;

    }


    .play-button {

        width: 44px;
        height: 44px;

        font-size: 14px;

    }

}


/* =========================================
   VERY SMALL MOBILE
========================================= */

@media (max-width: 400px) {

    .roadways-title .deluxe {

        font-size: 47px;

    }


    .roadways-title .roadways {

        font-size: 59px;

    }


    .links a {

        font-size: 10px;

    }


    .player {

        width:
            calc(100vw - 14px);

        bottom:
            calc(
                7px +
                env(safe-area-inset-bottom)
            );

        min-height: 78px;

        padding:
            7px 9px;

        gap: 8px;

        border-radius: 40px;

    }


    .album-art {

        width: 48px;
        height: 48px;

    }


    .song-name {

        font-size: 12px;

    }


    .artist {

        font-size: 9px;

    }


    .controls {

        gap: 2px;

    }


    .side-button {

        width: 18px;

        font-size: 9px;

    }


    .play-button {

        width: 42px;
        height: 42px;

    }

}
        /* =================================
           SPOTIFY EMBED OVERRIDES
        ================================= */

        .spotify-player {
            width: min(820px, calc(100vw - 40px));
            padding: 8px;
            min-height: 0;
            border-radius: 28px;
            background: linear-gradient(
                180deg,
                rgba(255, 255, 255, 0.15),
                rgba(255, 255, 255, 0.055)
            );
            backdrop-filter: blur(24px) saturate(1.7);
            -webkit-backdrop-filter: blur(24px) saturate(1.7);
            border: 1px solid rgba(255,255,255,0.10);
            box-shadow:
                0 16px 48px -12px rgba(0,0,0,0.8),
                inset 0 1px 0 rgba(255,255,255,0.2);
        }

        .spotify-embed {
            width: 100%;
            overflow: hidden;
            border-radius: 20px;
        }

        .spotify-embed iframe {
            display: block;
            width: 100%;
            height: 152px;
            border: 0;
        }

        @media (orientation: portrait) {
            .scene {
                background-image: url("assets/tall.png");
            }
        }

        @media (max-width: 700px) {
            .spotify-player {
                width: calc(100vw - 20px);
                padding: 6px;
                border-radius: 24px;
            }

            .spotify-embed {
                border-radius: 18px;
            }
        }
    </style>
</head>

<body>

    <div class="scene">

        <div class="overlay"></div>

        <header class="topbar">

            <div class="time" id="time">
                6:00 pm
            </div>

            <div class="online">

                <span class="online-dot"></span>

                <span id="listeners">34</span>

                <span>online</span>

            </div>

            <nav class="links">

                <a
                    href="https://open.spotify.com/playlist/0rmIgHUJdj45xxIl9zPd2I"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Spotify
                    <span>↗</span>
                </a>

            </nav>

        </header>

        <section class="hero">

            <h1 class="roadways-title">

                <span class="deluxe">
                    डीलक्स
                </span>

                <span class="roadways">
                    रोडवेज
                </span>

            </h1>

        </section>

        <section
            class="player spotify-player"
            aria-label="Spotify music player"
        >

            <div class="spotify-embed">

                <iframe
                    src="https://open.spotify.com/embed/playlist/2AVjI8Z57bqMJVtU3V9X1Q?utm_source=generator&theme=0"
                    width="100%"
                    height="152"
                    frameborder="0"
                    allowfullscreen=""
                    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                    loading="lazy"
                    title="Deluxe Roadways Spotify Playlist"
                ></iframe>

            </div>

        </section>

    </div>

    <script>
/* DELUXE ROADWAYS - INLINE JS */

const timeElement = document.getElementById("time");
const listenersElement = document.getElementById("listeners");

function updateClock() {
    if (!timeElement) return;

    timeElement.textContent = new Intl.DateTimeFormat("en-IN", {
        timeZone: "Asia/Kolkata",
        hour: "numeric",
        minute: "2-digit",
        hour12: true
    }).format(new Date());
}

function updateListeners() {
    if (!listenersElement) return;

    const base = 34;
    const variation = Math.floor(Math.random() * 7) - 3;

    listenersElement.textContent = Math.max(1, base + variation);
}

updateClock();
updateListeners();

setInterval(updateClock, 1000);
setInterval(updateListeners, 30000);

    </script>

</body>
</html>
