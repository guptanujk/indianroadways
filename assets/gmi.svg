<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Bus Body -->
  <rect x="4" y="4" width="24" height="22" rx="4" fill="#2563EB"/>
  
  <!-- Windshield -->
  <rect x="7" y="7" width="18" height="8" rx="1.5" fill="#93C5FD"/>
  
  <!-- Side Windows/Bumper Divider -->
  <line x1="4" y1="18" x2="28" y2="18" stroke="#1E40AF" stroke-width="1.5"/>
  
  <!-- Headlights -->
  <circle cx="8.5" cy="21.5" r="1.5" fill="#FDE047"/>
  <circle cx="23.5" cy="21.5" r="1.5" fill="#FDE047"/>
  
  <!-- Grille -->
  <rect x="13" y="20.5" width="6" height="2" rx="1" fill="#1E40AF"/>
  
  <!-- Wheels -->
  <rect x="7" y="26" width="4" height="3" rx="1" fill="#1E293B"/>
  <rect x="21" y="26" width="4" height="3" rx="1" fill="#1E293B"/>
</svg>
